<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Gemini Quota home-screen widget showing a 5-hour window at 42% and a weekly window at 18%">
  <title>Gemini Quota widget (mock)</title>
  <desc>Redrawn from the app's own colours; the percentages and reset times are placeholders.</desc>

  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8C7FA"/>
      <stop offset="1" stop-color="#C6A0FF"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="6" y="6" width="948" height="588" rx="60" fill="#1C1F24" stroke="#33FFFFFF" stroke-width="3"/>

  <!-- title row -->
  <text x="42" y="86" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="45" font-weight="700" fill="#E3E3E3">Gemini limits</text>
  <rect x="330" y="48" width="118" height="46" rx="30" fill="#25304A"/>
  <text x="389" y="81" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#A8ABB4" text-anchor="middle">AI Pro</text>
  <circle cx="474" cy="71" r="9" fill="#81C995"/>

  <text x="820" y="82" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#A8ABB4" text-anchor="end">Updated just now</text>
  <g transform="translate(846 34) scale(3.2)" fill="#A8ABB4">
    <path d="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -8,8s3.57,8 8,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z"/>
  </g>

  <!-- 5-hour window -->
  <text x="42" y="216" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#A8ABB4">5-hour window</text>
  <text x="866" y="222" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#81C995" text-anchor="end">42%</text>
  <text x="918" y="220" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#A8ABB4" text-anchor="end">used</text>

  <rect x="42" y="248" width="876" height="22" rx="11" fill="#3C4043"/>
  <rect x="42" y="248" width="368" height="22" rx="11" fill="url(#bar)"/>
  <text x="42" y="318" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" fill="#A8ABB4">Resets today · 03:10</text>

  <!-- weekly window -->
  <text x="42" y="428" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#A8ABB4">Weekly window</text>
  <text x="866" y="434" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#81C995" text-anchor="end">18%</text>
  <text x="918" y="432" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#A8ABB4" text-anchor="end">used</text>

  <rect x="42" y="460" width="876" height="22" rx="11" fill="#3C4043"/>
  <rect x="42" y="460" width="158" height="22" rx="11" fill="url(#bar)"/>
  <text x="42" y="530" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" fill="#A8ABB4">Resets Tue 27 Oct · 10:10</text>
</svg>
